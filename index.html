<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kozy OS</title>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;500;600;700&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#f0eeff;--s1:#faf9ff;--s2:#fff;--s3:#f5f2ff;
  --b1:rgba(160,140,230,.15);--b2:rgba(160,140,230,.25);
  --t1:#3d3560;--t2:#8a82b0;--t3:#bdb8d8;
  --grad:linear-gradient(135deg,#c8b8f0,#a8c8f8);
  --purple:#9b7fe8;--pdim:rgba(155,127,232,.12);--pborder:rgba(155,127,232,.3);
  --green:#78c878;--gdim:rgba(120,200,120,.12);--gborder:rgba(120,200,120,.3);
  --red:#e87878;--rdim:rgba(232,120,120,.12);--rborder:rgba(232,120,120,.3);
  --amber:#f0c060;--adim:rgba(240,192,96,.12);--aborder:rgba(240,192,96,.3);
  --blue:#72aef5;--bdim:rgba(114,174,245,.12);
  --r:12px;--rsm:8px;
  --font:'Nunito',sans-serif;--mono:'DM Mono',monospace;
  --shadow:0 2px 12px rgba(155,127,232,.1);
  --shadow-md:0 4px 24px rgba(155,127,232,.15);
}
body{font-family:var(--font);font-size:14px;color:var(--t1);background:var(--bg);min-height:100vh;line-height:1.6}
.wrap{max-width:900px;margin:0 auto;padding:24px 20px}

/* Header */
.header{display:flex;align-items:center;justify-content:space-between;margin-bottom:28px}
.logo{font-family:var(--mono);font-size:20px;font-weight:700;background:var(--grad);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
.date-label{font-size:12px;color:var(--t3);font-family:var(--mono);font-weight:500}

/* Buttons */
.btn{display:inline-flex;align-items:center;gap:6px;padding:8px 16px;border-radius:var(--rsm);border:1px solid var(--b2);background:var(--s2);color:var(--t2);font-size:12px;font-weight:600;cursor:pointer;font-family:var(--font);transition:all .15s;white-space:nowrap}
.btn:hover{color:var(--purple);border-color:var(--pborder);background:var(--pdim)}
.btn-grad{background:var(--grad);border:none;color:#fff;box-shadow:var(--shadow)}
.btn-grad:hover{opacity:.9;transform:translateY(-1px);box-shadow:var(--shadow-md)}
.btn-outline{border:1px solid var(--pborder);color:var(--purple);background:var(--pdim)}
.btn-google{border:1px solid var(--b2);background:var(--s2);color:var(--t1);gap:8px}
.btn-google:hover{border-color:var(--pborder)}
.btn-sm{padding:5px 10px;font-size:11px}
.btn-danger{color:var(--red);border-color:var(--rborder);background:var(--rdim)}
.btn-danger:hover{background:rgba(232,120,120,.2)}

/* Grid */
.grid{display:grid;grid-template-columns:1fr 1fr;gap:20px;margin-bottom:20px}
@media(max-width:640px){.grid{grid-template-columns:1fr}}

/* Card */
.card{background:var(--s2);border:1px solid var(--b1);border-radius:var(--r);box-shadow:var(--shadow);overflow:hidden}
.card-header{display:flex;align-items:center;justify-content:space-between;padding:14px 18px;border-bottom:1px solid var(--b1)}
.card-title{font-size:14px;font-weight:700;color:var(--t1);display:flex;align-items:center;gap:8px}
.card-body{padding:16px 18px}

/* Badge */
.badge{display:inline-flex;font-size:10px;font-weight:700;padding:3px 8px;border-radius:20px}
.badge-purple{background:var(--pdim);color:var(--purple);border:1px solid var(--pborder)}
.badge-green{background:var(--gdim);color:var(--green);border:1px solid var(--gborder)}
.badge-amber{background:var(--adim);color:var(--amber);border:1px solid var(--aborder)}
.badge-gray{background:rgba(189,184,216,.15);color:var(--t3);border:1px dashed var(--t3)}

/* Google Calendar 연결 상태 */
.cal-status{display:flex;align-items:center;gap:8px;padding:12px 16px;border-radius:var(--rsm);margin-bottom:14px;font-size:13px;font-weight:600}
.cal-status.connected{background:var(--gdim);border:1px solid var(--gborder);color:var(--green)}
.cal-status.disconnected{background:var(--adim);border:1px solid var(--aborder);color:var(--amber)}
.dot{width:8px;height:8px;border-radius:50%;background:currentColor;flex-shrink:0;animation:pk 2s infinite}
@keyframes pk{0%,100%{opacity:1}50%{opacity:.4}}

/* 일정 아이템 */
.event-item{display:flex;align-items:flex-start;gap:12px;padding:10px 0;border-bottom:1px solid var(--b1)}
.event-item:last-child{border-bottom:none}
.event-time{font-size:11px;font-weight:700;color:var(--purple);font-family:var(--mono);min-width:70px;margin-top:2px}
.event-title{font-size:13px;font-weight:600;color:var(--t1)}
.event-loc{font-size:11px;color:var(--t3);margin-top:2px}
.event-allday{font-size:11px;font-weight:700;color:var(--t3);font-family:var(--mono);min-width:70px;margin-top:2px}

/* 할 일 */
.task-item{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid var(--b1);transition:all .12s;position:relative}
.task-item:last-child{border-bottom:none}
.task-item:hover{margin:0 -18px;padding:9px 18px;background:var(--s3);border-radius:var(--rsm)}
.task-cb{width:18px;height:18px;min-width:18px;border:2px solid var(--b2);border-radius:5px;display:flex;align-items:center;justify-content:center;cursor:pointer;transition:all .15s;font-size:10px}
.task-cb.done{background:var(--grad);border:none;color:#fff}
.task-text{flex:1;font-size:13px;font-weight:500;cursor:pointer}
.task-text.done{color:var(--t3);text-decoration:line-through}
.task-del{display:none;background:none;border:none;color:var(--t3);cursor:pointer;font-size:16px;padding:0 4px;line-height:1}
.task-item:hover .task-del{display:block}
.task-del:hover{color:var(--red)}

/* Add task */
.add-row{display:flex;gap:8px;padding:10px 18px;border-top:1px solid var(--b1);background:var(--s3)}
.inp{background:var(--s2);border:1px solid var(--b2);border-radius:var(--rsm);color:var(--t1);padding:8px 12px;font-size:13px;font-family:var(--font);outline:none;font-weight:500}
.inp:focus{border-color:var(--pborder)}

/* AI 스케줄 */
.schedule-section{margin-top:20px}
.schedule-box{background:var(--s2);border:1px solid var(--b1);border-radius:var(--r);box-shadow:var(--shadow)}
.schedule-header{display:flex;align-items:center;justify-content:space-between;padding:14px 18px;border-bottom:1px solid var(--b1)}
.schedule-body{padding:16px 18px}
.schedule-result{font-size:13px;line-height:1.9;color:var(--t1);white-space:pre-wrap;font-weight:500}
.loading-wrap{display:flex;align-items:center;gap:8px;color:var(--t2);font-size:13px;font-weight:600;padding:12px 0}
.dot-anim span{display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--purple);animation:bounce .9s infinite;margin:0 2px}
.dot-anim span:nth-child(2){animation-delay:.2s}
.dot-anim span:nth-child(3){animation-delay:.4s}
@keyframes bounce{0%,80%,100%{transform:scale(.5);opacity:.4}40%{transform:scale(1);opacity:1}}

/* Empty */
.empty{text-align:center;padding:24px 0;color:var(--t3);font-size:12px;font-weight:600}

/* Notif */
.notif{position:fixed;bottom:24px;right:24px;background:var(--s2);border:1px solid var(--pborder);border-radius:var(--r);padding:10px 18px;font-size:13px;font-weight:700;color:var(--purple);z-index:200;transform:translateY(50px);opacity:0;transition:all .3s;pointer-events:none;box-shadow:var(--shadow-md)}
.notif.show{transform:translateY(0);opacity:1}

/* Auth callback overlay */
.auth-overlay{display:none;position:fixed;inset:0;background:rgba(61,53,96,.5);backdrop-filter:blur(8px);z-index:100;align-items:center;justify-content:center}
.auth-overlay.show{display:flex}
.auth-box{background:var(--s2);border-radius:var(--r);padding:32px;text-align:center;max-width:360px;width:90%;box-shadow:var(--shadow-md)}
.auth-box h3{font-size:18px;font-weight:700;margin-bottom:8px;color:var(--t1)}
.auth-box p{font-size:13px;color:var(--t2);margin-bottom:20px}

/* Progress bar */
.prog{height:4px;background:var(--b1);border-radius:2px;margin-top:10px;overflow:hidden}
.pf{height:100%;border-radius:2px;background:var(--grad);transition:width .5s}

::-webkit-scrollbar{width:5px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--b2);border-radius:3px}
</style>
</head>
<body>

<div class="wrap">
  <!-- Header -->
  <div class="header">
    <div class="logo">KozyOS</div>
    <div style="display:flex;align-items:center;gap:12px">
      <div class="date-label" id="date-label"></div>
      <button class="btn btn-sm" id="cal-btn" onclick="handleCalBtn()">Google Calendar 연결</button>
    </div>
  </div>

  <!-- Google Calendar 상태 -->
  <div class="cal-status disconnected" id="cal-status">
    <span class="dot" style="animation:none;opacity:.6"></span>
    Google Calendar 연결 필요 — 위 버튼을 눌러 연결하세요
  </div>

  <!-- 메인 그리드 -->
  <div class="grid">

    <!-- 오늘 일정 -->
    <div class="card">
      <div class="card-header">
        <div class="card-title">📅 오늘 일정</div>
        <button class="btn btn-sm" onclick="loadTodayEvents()" id="refresh-btn">새로고침</button>
      </div>
      <div class="card-body" id="events-body">
        <div class="empty">Google Calendar 연결 후<br>일정이 자동으로 표시돼요</div>
      </div>
    </div>

    <!-- 할 일 목록 -->
    <div class="card">
      <div class="card-header">
        <div class="card-title">✅ 오늘 할 일</div>
        <span class="badge badge-purple" id="task-pct">0%</span>
      </div>
      <div class="card-body" id="tasks-body" style="max-height:320px;overflow-y:auto"></div>
      <div class="add-row">
        <input class="inp" id="task-inp" placeholder="할 일 추가..." style="flex:1" onkeydown="if(event.key==='Enter')addTask()">
        <button class="btn btn-grad" onclick="addTask()">+</button>
      </div>
      <div class="prog"><div class="pf" id="task-prog"></div></div>
    </div>

  </div>

  <!-- AI 스케줄 생성 -->
  <div class="schedule-box">
    <div class="schedule-header">
      <div class="card-title">🤖 AI 하루 스케줄 생성</div>
      <div style="display:flex;gap:8px;align-items:center">
        <button class="btn btn-sm btn-outline" onclick="openScheduleInput()">추가 정보 입력</button>
        <button class="btn btn-grad" onclick="generateSchedule()">스케줄 생성</button>
      </div>
    </div>
    <div class="schedule-body">
      <!-- 추가 정보 입력 (접힘) -->
      <div id="extra-input" style="display:none;margin-bottom:14px;padding-bottom:14px;border-bottom:1px solid var(--b1)">
        <div style="font-size:11px;font-weight:700;color:var(--t2);text-transform:uppercase;letter-spacing:.07em;margin-bottom:8px">추가 정보 (선택)</div>
        <textarea class="inp" id="extra-info" style="width:100%;min-height:70px;resize:vertical" placeholder="예: 오전에 집중력이 좋아요 / 점심은 1시간 / 이동 시간 고려해줘 / 저녁 7시 약속"></textarea>
        <button class="btn btn-sm" style="margin-top:8px" onclick="closeScheduleInput()">접기</button>
      </div>
      <div id="schedule-result">
        <div class="empty">스케줄 생성 버튼을 누르면<br>오늘 일정과 할 일을 분석해서 최적의 하루 스케줄을 만들어줘요</div>
      </div>
    </div>
  </div>

</div>

<!-- Auth Overlay -->
<div class="auth-overlay" id="auth-overlay">
  <div class="auth-box">
    <h3>Google Calendar 연결 중</h3>
    <p>잠시만 기다려주세요...</p>
  </div>
</div>

<div class="notif" id="notif"></div>

<!-- Auth Callback Script (URL에 code 파라미터 처리) -->
<script>
var SK = 'kozy-os-schedule-v1';

// 상태
var state = {
  accessToken: null,
  refreshToken: null,
  tokenExpiry: null,
  todayEvents: [],
  tasks: [],
  nid: 1
};

// 초기화
function init() {
  loadState();
  updateDateLabel();
  renderTasks();

  // URL에 code 파라미터가 있으면 OAuth 콜백 처리
  var params = new URLSearchParams(window.location.search);
  var code = params.get('code');
  if (code) {
    document.getElementById('auth-overlay').classList.add('show');
    exchangeCode(code);
    return;
  }

  updateCalStatus();
  if (state.accessToken) {
    loadTodayEvents();
  }
}

// 날짜 표시
function updateDateLabel() {
  var now = new Date();
  var days = ['일', '월', '화', '수', '목', '금', '토'];
  var label = (now.getMonth()+1) + '월 ' + now.getDate() + '일 (' + days[now.getDay()] + ')';
  document.getElementById('date-label').textContent = label;
}

// 캘린더 연결 상태 업데이트
function updateCalStatus() {
  var statusEl = document.getElementById('cal-status');
  var btnEl = document.getElementById('cal-btn');
  if (state.accessToken) {
    statusEl.className = 'cal-status connected';
    statusEl.innerHTML = '<span class="dot"></span>Google Calendar 연결됨';
    btnEl.textContent = '연결 해제';
  } else {
    statusEl.className = 'cal-status disconnected';
    statusEl.innerHTML = '<span class="dot" style="animation:none;opacity:.6"></span>Google Calendar 연결 필요 — 위 버튼을 눌러 연결하세요';
    btnEl.textContent = 'Google Calendar 연결';
  }
}

// 캘린더 버튼 핸들러
async function handleCalBtn() {
  if (state.accessToken) {
    // 연결 해제
    state.accessToken = null;
    state.refreshToken = null;
    state.tokenExpiry = null;
    saveState();
    updateCalStatus();
    document.getElementById('events-body').innerHTML = '<div class="empty">Google Calendar 연결 후<br>일정이 자동으로 표시돼요</div>';
    notif('연결 해제됐어요');
    return;
  }
  // 연결 시작
  try {
    var res = await fetch('/.netlify/functions/google-auth', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({action: 'get_auth_url'})
    });
    var data = await res.json();
    if (data.url) {
      window.location.href = data.url;
    } else {
      notif('오류: ' + (data.error || '알 수 없는 오류'));
    }
  } catch(e) {
    notif('오류: ' + e.message);
  }
}

// OAuth 코드 교환
async function exchangeCode(code) {
  try {
    var res = await fetch('/.netlify/functions/google-auth', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({action: 'exchange_code', code: code})
    });
    var data = await res.json();
    if (data.error) {
      document.getElementById('auth-overlay').classList.remove('show');
      notif('인증 오류: ' + data.error);
      return;
    }
    state.accessToken = data.access_token;
    state.refreshToken = data.refresh_token;
    state.tokenExpiry = Date.now() + (data.expires_in * 1000);
    saveState();

    // URL에서 code 파라미터 제거
    window.history.replaceState({}, document.title, '/');
    document.getElementById('auth-overlay').classList.remove('show');
    updateCalStatus();
    notif('Google Calendar 연결됐어요!');
    loadTodayEvents();
  } catch(e) {
    document.getElementById('auth-overlay').classList.remove('show');
    notif('오류: ' + e.message);
  }
}

// 토큰 갱신
async function refreshAccessToken() {
  if (!state.refreshToken) return false;
  try {
    var res = await fetch('/.netlify/functions/google-auth', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({action: 'refresh_token', refresh_token: state.refreshToken})
    });
    var data = await res.json();
    if (data.error) return false;
    state.accessToken = data.access_token;
    state.tokenExpiry = Date.now() + (data.expires_in * 1000);
    saveState();
    return true;
  } catch(e) {
    return false;
  }
}

// 유효한 토큰 가져오기
async function getValidToken() {
  if (!state.accessToken) return null;
  // 만료 5분 전이면 갱신
  if (state.tokenExpiry && Date.now() > state.tokenExpiry - 300000) {
    var ok = await refreshAccessToken();
    if (!ok) return null;
  }
  return state.accessToken;
}

// 오늘 일정 불러오기
async function loadTodayEvents() {
  var token = await getValidToken();
  if (!token) {
    notif('Google Calendar 연결이 필요해요');
    return;
  }

  var body = document.getElementById('events-body');
  body.innerHTML = '<div class="loading-wrap">일정 불러오는 중<div class="dot-anim"><span></span><span></span><span></span></div></div>';

  try {
    var res = await fetch('/.netlify/functions/google-auth', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({action: 'get_today_events', access_token: token})
    });
    var data = await res.json();
    if (data.error) {
      body.innerHTML = '<div class="empty">오류: ' + data.error + '</div>';
      return;
    }
    state.todayEvents = data.events || [];
    renderEvents();
  } catch(e) {
    body.innerHTML = '<div class="empty">오류: ' + e.message + '</div>';
  }
}

// 일정 렌더링
function renderEvents() {
  var body = document.getElementById('events-body');
  if (!state.todayEvents.length) {
    body.innerHTML = '<div class="empty">오늘 일정이 없어요</div>';
    return;
  }
  body.innerHTML = state.todayEvents.map(function(e) {
    var timeStr = '';
    if (e.allDay) {
      timeStr = '<div class="event-allday">하루종일</div>';
    } else {
      var start = new Date(e.start);
      var end = new Date(e.end);
      var fmt = function(d) {
        return String(d.getHours()).padStart(2,'0') + ':' + String(d.getMinutes()).padStart(2,'0');
      };
      timeStr = '<div class="event-time">' + fmt(start) + '<br>' + fmt(end) + '</div>';
    }
    return '<div class="event-item">' + timeStr +
      '<div><div class="event-title">' + e.title + '</div>' +
      (e.location ? '<div class="event-loc">📍 ' + e.location + '</div>' : '') +
      '</div></div>';
  }).join('');
}

// 할 일
function addTask() {
  var inp = document.getElementById('task-inp');
  var text = inp.value.trim();
  if (!text) return;
  state.tasks.push({id: state.nid++, text: text, done: false});
  inp.value = '';
  renderTasks();
  saveState();
  notif('추가됐어요!');
}
function toggleTask(id) {
  var t = state.tasks.find(function(t){return t.id===id;});
  if (t) {t.done = !t.done; renderTasks(); saveState();}
}
function delTask(id) {
  state.tasks = state.tasks.filter(function(t){return t.id!==id;});
  renderTasks();
  saveState();
}
function renderTasks() {
  var body = document.getElementById('tasks-body');
  var pct = document.getElementById('task-pct');
  var prog = document.getElementById('task-prog');

  if (!state.tasks.length) {
    body.innerHTML = '<div class="empty" style="padding:16px 0">할 일을 추가해보세요</div>';
    pct.textContent = '0%';
    prog.style.width = '0%';
    return;
  }

  var done = state.tasks.filter(function(t){return t.done;}).length;
  var total = state.tasks.length;
  var p = Math.round(done/total*100);
  pct.textContent = p + '%';
  prog.style.width = p + '%';

  body.innerHTML = state.tasks.map(function(t) {
    return '<div class="task-item">' +
      '<div class="task-cb ' + (t.done?'done':'') + '" onclick="toggleTask(' + t.id + ')">' + (t.done?'✓':'') + '</div>' +
      '<div class="task-text ' + (t.done?'done':'') + '" onclick="toggleTask(' + t.id + ')">' + t.text + '</div>' +
      '<button class="task-del" onclick="delTask(' + t.id + ')">×</button>' +
      '</div>';
  }).join('');
}

// 추가 정보 토글
function openScheduleInput() {
  document.getElementById('extra-input').style.display = 'block';
  document.getElementById('extra-info').focus();
}
function closeScheduleInput() {
  document.getElementById('extra-input').style.display = 'none';
}

// AI 스케줄 생성
async function generateSchedule() {
  var result = document.getElementById('schedule-result');
  result.innerHTML = '<div class="loading-wrap">Claude가 하루 스케줄을 짜는 중<div class="dot-anim"><span></span><span></span><span></span></div></div>';

  var now = new Date();
  var timeStr = String(now.getHours()).padStart(2,'0') + ':' + String(now.getMinutes()).padStart(2,'0');

  // 오늘 일정 텍스트
  var eventsText = '없음';
  if (state.todayEvents.length) {
    eventsText = state.todayEvents.map(function(e) {
      if (e.allDay) return '- ' + e.title + ' (하루종일)';
      var s = new Date(e.start);
      var en = new Date(e.end);
      var fmt = function(d){return String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0');};
      return '- ' + fmt(s) + '~' + fmt(en) + ' ' + e.title + (e.location?' ('+e.location+')':'');
    }).join('\n');
  }

  // 할 일 텍스트
  var tasksText = '없음';
  var remaining = state.tasks.filter(function(t){return !t.done;});
  if (remaining.length) {
    tasksText = remaining.map(function(t){return '- ' + t.text;}).join('\n');
  }

  var extra = document.getElementById('extra-info').value.trim();

  var prompt = '지금 시각: ' + timeStr + '\n\n' +
    '오늘 캘린더 일정:\n' + eventsText + '\n\n' +
    '완료 안 된 할 일:\n' + tasksText + '\n\n' +
    (extra ? '추가 정보:\n' + extra + '\n\n' : '') +
    '위 정보를 바탕으로 오늘 하루 시간별 스케줄을 짜줘.\n' +
    '규칙:\n' +
    '1. 캘린더 일정은 고정 시간으로 배치\n' +
    '2. 할 일은 집중력과 에너지를 고려해서 적절히 배치\n' +
    '3. 식사, 휴식 시간 포함\n' +
    '4. 각 항목: 시작시간-종료시간 / 내용 형식\n' +
    '5. 현실적이고 실행 가능하게';

  var sys = '당신은 Henry Ahn의 하루 스케줄을 짜주는 어시스턴트입니다. 서울 기반 1인 크리에이터로 SNS 채널 운영, 교육 콘텐츠 제작, 커뮤니티 운영을 합니다. 간결하고 실용적인 스케줄을 작성하세요.';

  try {
    var res = await fetch('/.netlify/functions/claude', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({prompt: prompt, system: sys, max_tokens: 800})
    });
    var data = await res.json();
    if (data.error) {
      result.innerHTML = '<div class="empty">오류: ' + data.error + '</div>';
      return;
    }
    result.innerHTML = '<div class="schedule-result">' + data.text + '</div>';
  } catch(e) {
    result.innerHTML = '<div class="empty">오류: ' + e.message + '</div>';
  }
}

// Storage
function saveState() {
  try {
    localStorage.setItem(SK, JSON.stringify({
      accessToken: state.accessToken,
      refreshToken: state.refreshToken,
      tokenExpiry: state.tokenExpiry,
      tasks: state.tasks,
      nid: state.nid
    }));
  } catch(e) {}
}
function loadState() {
  try {
    var d = localStorage.getItem(SK);
    if (d) {
      var p = JSON.parse(d);
      if (p.accessToken) state.accessToken = p.accessToken;
      if (p.refreshToken) state.refreshToken = p.refreshToken;
      if (p.tokenExpiry) state.tokenExpiry = p.tokenExpiry;
      if (p.tasks && p.tasks.length) state.tasks = p.tasks;
      if (p.nid) state.nid = p.nid;
    }
  } catch(e) {}
}
function notif(msg) {
  var el = document.getElementById('notif');
  el.textContent = msg;
  el.classList.add('show');
  setTimeout(function(){el.classList.remove('show');}, 2500);
}

init();
</script>
